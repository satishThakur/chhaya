<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chhaya traces</title>
<style>
  :root {
    --bg: #fafaf8; --panel: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e2e1dc;
    --user: #e8f0fb; --assistant: #f1efe9; --tool: #f7f7f4;
    --good: #1f7a45; --bad: #b3261e; --warn: #8a5a00; --accent: #2a5db0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1f1f1c; --ink: #ecebe6; --muted: #9a9a93; --line: #34342f;
      --user: #1d2b40; --assistant: #2a2924; --tool: #232320;
      --good: #5ec28a; --bad: #f2877f; --warn: #e0b14d; --accent: #8db4f0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on-pass { background: var(--good); color: #fff; border-color: var(--good); }
  button.on-fail { background: var(--bad); color: #fff; border-color: var(--bad); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  #msg { font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .m { border-radius: 8px; padding: 9px 12px; margin: 8px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m.user { background: var(--user); margin-right: 14%; }
  .m.assistant { background: var(--assistant); margin-left: 6%; }
  .turn { border: 1px solid var(--accent); border-radius: 10px; margin: 14px 0; padding: 0 10px 8px; background: var(--panel); }
  .turn-head { margin: 0 -10px; padding: 5px 12px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
               color: var(--accent); border-bottom: 1px solid var(--line); border-radius: 10px 10px 0 0; }
  .turn .llm { border: 0; border-left: 3px solid var(--line); border-radius: 0; margin: 8px 0; padding: 2px 10px; background: transparent; }
  .turn .m { margin-left: 0; margin-right: 0; }
  .m.reply { border-left: 4px solid var(--accent); background: var(--assistant); }
  .m.reply .role { color: var(--accent); font-weight: 600; }
  .ask { font-weight: 600; margin-bottom: 2px; }
  .m.tool { background: var(--tool); border: 1px solid var(--line); font-size: 13px; margin-left: 6%; }
  .role { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
  .call { font: 12.5px ui-monospace, Menlo, monospace; margin-top: 6px; padding: 5px 8px; border-left: 3px solid var(--accent);
          background: var(--panel); white-space: pre-wrap; overflow-wrap: anywhere; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 6px;
           border: 1px solid var(--line); background: var(--panel); }
  .badge.allow { color: var(--good); border-color: var(--good); }
  .badge.deny, .badge.warn { color: var(--bad); border-color: var(--bad); }
  .badge.q { color: var(--warn); border-color: var(--warn); }
  details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre { margin: 6px 0 0; font: 12.5px ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 14px 0; font-size: 13px; }
  .box.red { border-color: var(--bad); }
  .box.red h3 { color: var(--bad); }
  .box h3 { margin: 0 0 4px; font-size: 13px; }
  .annot { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px 14px; margin: 22px 0 60px; }
  .annot h2 { font-size: 14px; margin: 0 0 8px; }
  .annot label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 3px; }
  textarea, input[type=text] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line);
           border-radius: 6px; background: var(--bg); color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stale { color: var(--warn); font-size: 13px; margin-top: 8px; }
  .llm { border: 1px dashed var(--accent); border-radius: 8px; margin: 8px 0 0; padding: 4px 10px; font-size: 13px; background: var(--panel); }
  .llm > summary { color: var(--accent); }
  .lm { border-left: 3px solid var(--line); padding: 3px 8px; margin: 6px 0; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .lm.system { border-color: var(--warn); } .lm.user { border-color: var(--accent); } .lm.assistant { border-color: var(--muted); }
  .lm .role { margin: 0; }
  .note { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 8px; padding: 6px 12px; margin: 10px 0; }
  .tool-def { margin: 4px 0; } .tool-def b { font: 12.5px ui-monospace, Menlo, monospace; }
  #empty { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Chhaya traces</h1>
  <button id="prev" title="Previous (←)">&larr; Prev</button>
  <button id="next" title="Next (→)">Next &rarr;</button>
  <button id="nextun" title="Next unannotated (n)">Next unannotated</button>
  <span id="pos" class="muted"></span>
  <span class="spacer"></span>
  <span id="msg" class="muted"></span>
  <span id="unsynced" class="muted"></span>
  <button id="export" title="Push annotations to the bucket">Export</button>
</header>
<main>
  <div id="empty" hidden>No traces yet. Run <code>chhayactl trace export</code> on the box, or point -s3 at the bucket.</div>
  <div id="view" hidden>
    <div class="meta" id="meta"></div>
    <div id="convo"></div>
    <div id="unmatched"></div>
    <div id="events"></div>
    <section class="annot">
      <h2>Your verdict</h2>
      <div class="row">
        <button id="pass">Pass</button>
        <button id="fail">Fail</button>
        <span class="muted" id="saved"></span>
      </div>
      <label for="note">First thing that went wrong (your words)</label>
      <textarea id="note"></textarea>
      <label for="wanted">What you wanted instead</label>
      <textarea id="wanted"></textarea>
      <label for="mode">Failure mode (leave empty until you have grouped the notes)</label>
      <input type="text" id="mode" autocomplete="off">
      <div class="stale" id="stale" hidden></div>
    </section>
  </div>
</main>
<script>
"use strict";
// Every value from a trace is put in the page with textContent, never innerHTML:
// conversations contain whatever anyone typed or any tool returned.
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (method !== "GET") {
    opt.headers["X-Chhaya"] = "1";
    opt.headers["Content-Type"] = "application/json";
  }
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const ist = (s) => new Date(s).toLocaleString("en-GB", { timeZone: "Asia/Kolkata", dateStyle: "medium", timeStyle: "short" }) + " IST";
const pretty = (v) => (v === undefined || v === null ? "" : typeof v === "string" ? v : JSON.stringify(v, null, 1));

let refs = [], cur = -1, trace = null, ann = null, timer = null, dirty = false, canSync = false;

function say(text, bad) { const m = $("msg"); m.textContent = text; m.style.color = bad ? "var(--bad)" : ""; }
function setUnsynced(n) { $("unsynced").textContent = n ? n + " unsynced" : "all synced"; $("export").disabled = !canSync || n === 0; }

async function loadIndex(keep) {
  const j = await api("GET", "/api/index");
  refs = j.refs || []; canSync = j.can_sync; setUnsynced(j.unsynced);
  $("empty").hidden = refs.length > 0; $("view").hidden = refs.length === 0;
  if (!refs.length) return;
  if (keep) return;
  const want = location.hash.slice(1).split("/");
  let i = refs.findIndex((r) => r.day === want[0] && r.id === want[1]);
  if (i < 0) { // open on the first trace of the newest day
    const lastDay = refs[refs.length - 1].day;
    i = refs.findIndex((r) => r.day === lastDay);
  }
  await show(i);
}

async function flush() {
  if (!dirty || !trace) return;
  clearTimeout(timer); dirty = false;
  const body = {
    pass: ann && ann.pass !== undefined ? ann.pass : null,
    note: $("note").value, wanted: $("wanted").value, mode: $("mode").value,
    message_count: trace.message_count,
  };
  try {
    const j = await api("PUT", "/api/annotation/" + trace.day + "/" + trace.id, body);
    ann = Object.assign(ann || {}, body);
    refs[cur].annotated = true; setUnsynced(j.unsynced);
    $("saved").textContent = "saved";
  } catch (e) { dirty = true; say("save failed: " + e.message, true); }
}
function touch() { dirty = true; $("saved").textContent = "…"; clearTimeout(timer); timer = setTimeout(flush, 600); }

function paintVerdict() {
  const p = ann ? ann.pass : null;
  $("pass").className = p === true ? "on-pass" : "";
  $("fail").className = p === false ? "on-fail" : "";
}

async function show(i) {
  if (i < 0 || i >= refs.length) return;
  await flush();
  cur = i; const r = refs[i];
  location.hash = r.day + "/" + r.id;
  say("loading…");
  try {
    [trace, ann] = await Promise.all([api("GET", "/api/trace/" + r.day + "/" + r.id), api("GET", "/api/annotation/" + r.day + "/" + r.id)]);
  } catch (e) { say(e.message, true); return; }
  say("");
  render();
}

function callNode(c) {
  const n = el("div", "call");
  n.append(el("b", null, c.name));
  if (c.via) n.append(el("span", "muted", "  via " + c.via));
  const a = pretty(c.args ? c.args : null);
  if (a) n.append(document.createTextNode("\n" + a));
  return n;
}
function gatewayNode(g) {
  const d = el("div");
  const b = el("span", "badge " + (g.decision === "allow" ? "allow" : "deny"), "gateway: " + g.decision + " · tier " + g.tier + " · " + g.rule);
  d.append(b);
  const det = el("details"); det.append(el("summary", null, "audit #" + g.seq + " · " + g.actor + " · " + g.tool));
  det.append(el("pre", null, pretty({ ts: g.ts, args: g.args, reason: g.reason, taint: g.taint, approval: g.approval, result: g.result, duration_ms: g.duration_ms })));
  d.append(det); return d;
}
function entryBox(title, list, cls) {
  const box = el("div", "box " + cls); box.append(el("h3", null, title));
  list.forEach((g) => box.append(gatewayNode(g)));
  return box;
}


// ---- what the model was sent (from Hermes' request dumps; trace.llm) ---------------------
function wireText(m) {
  const c = m.content;
  if (c === null || c === undefined) return "";
  if (typeof c === "string") return c;
  if (Array.isArray(c)) return c.map((b) => (b && b.text !== undefined ? b.text : JSON.stringify(b))).join("");
  return JSON.stringify(c);
}
function wireMsgNode(m) {
  const n = el("div", "lm " + m.role);
  n.append(el("div", "role", m.role + (m.name ? " · " + m.name : "") + (m.tool_call_id ? " · " + m.tool_call_id : "")));
  const txt = wireText(m);
  if (txt) n.append(document.createTextNode(txt));
  if (m.tool_calls) n.append(el("div", "call", pretty(m.tool_calls)));
  return n;
}
function contextUpTo(llm, num) {
  let out = [];
  for (const c of llm.calls) { if (c.reset) out = []; out = out.concat(c.new || []); if (c.n === num) break; }
  return out;
}
function callPanel(llm, c) {
  const d = el("details", "llm");
  const isFirst = c === llm.calls[0];
  const bits = ["① Request sent to the model", c.total + " messages in context", isFirst ? "first request recorded" : "+" + (c.new || []).length + " new"];
  if (c.carried_messages) bits.push("carries " + c.carried_messages + " message(s) from earlier conversations in this session");
  if (c.attempts > 1) bits.push("sent " + c.attempts + "×");
  if (c.reset) bits.push("history was rewritten here");
  const first = llm.calls[0];
  if (c !== first && (c.system !== first.system)) bits.push("system prompt changed");
  if (c !== first && (c.tools !== first.tools)) bits.push("tools changed");
  d.append(el("summary", null, bits.join(" · ")));
  d.append(el("div", "muted", isFirst
    ? "The first request recorded for this session. It carries the whole history so far, including anything from before request dumps were switched on:"
    : "Messages added since the previous call, exactly as sent:"));
  (c.new || []).forEach((m) => d.append(wireMsgNode(m)));
  const all = el("details"); all.append(el("summary", null, "everything in this request (system prompt, tools, all " + c.total + " messages)"));
  let filled = false;
  all.addEventListener("toggle", () => {
    if (!all.open || filled) return; filled = true;
    const sys = llm.systems[c.system]; if (sys) all.append(wireMsgNode(sys));
    all.append(toolsNode(llm.tool_sets[c.tools]));
    contextUpTo(llm, c.n).forEach((m) => all.append(wireMsgNode(m)));
  });
  d.append(all); return d;
}
function toolsNode(tools) {
  const d = el("details"); const list = Array.isArray(tools) ? tools : [];
  d.append(el("summary", null, list.length + " tool definitions"));
  list.forEach((t) => {
    const f = t.function || t; const row = el("div", "tool-def");
    row.append(el("b", null, f.name || "?"), document.createTextNode("  " + (f.description || "")));
    const det = el("details"); det.append(el("summary", null, "schema")); det.append(el("pre", null, pretty(f.parameters || f.input_schema || f)));
    row.append(det); d.append(row);
  });
  return d;
}
function llmHeader(t) {
  const l = t.llm;
  if (!l || !(l.calls || []).length) {
    let why = "No request dumps for this session, so the system prompt, the tool definitions and what was injected into each request are not shown. Hermes writes them only when run with HERMES_DUMP_REQUESTS=1.";
    if (l && l.other_dumps) why += " (" + l.other_dumps + " error dump(s) exist but are not shown.)";
    return el("div", "note", why);
  }
  const box = el("details", "box");
  const sysKeys = Object.keys(l.systems || {});
  box.append(el("summary", null, "What the model was given · " + l.calls.length + " call(s) · system prompt" + (sysKeys.length > 1 ? "s (" + sysKeys.length + " versions)" : "") + " and tools"));
  sysKeys.forEach((k) => {
    const m = l.systems[k]; const det = el("details"); det.append(el("summary", null, "system prompt " + k + " (" + wireText(m).length + " chars)"));
    det.append(el("pre", null, wireText(m))); box.append(det);
  });
  Object.keys(l.tool_sets || {}).forEach((k) => box.append(toolsNode(l.tool_sets[k])));
  (l.problems || []).forEach((p) => box.append(el("div", "stale", "could not read a dump: " + p)));
  return box;
}

function render() {
  const t = trace, c = t.counters || {};
  $("pos").textContent = (cur + 1) + " of " + refs.length + " · " + t.day;
  $("prev").disabled = cur === 0; $("next").disabled = cur === refs.length - 1;
  const meta = $("meta"); meta.textContent = "";
  const kv = (k, v) => { meta.append(el("b", null, k + " "), document.createTextNode(v + "   ")); };
  kv("trace", t.id); kv("source", t.source);
  if (t.segments > 1) kv("conversation", t.segment + " of " + t.segments + " in session " + t.session_id + (t.gap_before_minutes ? " (after " + Math.round(t.gap_before_minutes / 6) / 10 + " h of silence)" : "")); kv("started", ist(t.started));
  if (t.model) kv("model", t.model);
  kv("messages", t.message_count); kv("questions", c.questions);
  kv("memory calls before first question", c.memory_calls_before_first_question < 0 ? "never asked" : c.memory_calls_before_first_question);
  kv("cost", "$" + (t.cost_usd || 0).toFixed(3));
  if (t.parent_id) kv("continues", t.parent_id);

  const convo = $("convo"); convo.textContent = "";
  convo.append(llmHeader(t));
  const byReply = {};
  ((t.llm && t.llm.calls) || []).forEach((cl) => { if (cl.reply_message_id) byReply[cl.reply_message_id] = cl; });
  // One card per model call: the request, the reply it produced, and the tool results that
  // reply triggered, so the three read as one step. Messages the page cannot tie to a call
  // (no dump, or the user's own messages) stay outside any card.
  let card = null;
  (t.messages || []).forEach((m) => {
    const reply = byReply[m.id];
    if (reply) {
      card = el("div", "turn");
      const th = el("div", "turn-head", "Model call " + reply.n + (reply.model ? " · " + reply.model : "") + (reply.reasoning_effort ? " · effort " + reply.reasoning_effort : ""));
      card.append(th, callPanel(t.llm, reply));
      convo.append(card);
    } else if (m.role !== "tool") card = null;
    const n = el("div", "m " + m.role);
    const when = new Date(m.time).toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata" });
    let label = m.role;
    if (reply) label = "② Reply from the model";
    else if (m.role === "tool" && card) label = "③ Result of the tool call above";
    const head = el("div", "role", label + (m.tool_name ? " · " + m.tool_name : "") + " · " + when);
    if (m.finish_reason) head.append(el("span", "badge", "finish: " + m.finish_reason));
    if (reply) n.classList.add("reply");
    if (m.id === c.first_question_message_id) head.append(el("span", "badge q", "counted as first question"));
    if (m.inactive) head.append(el("span", "badge", "inactive in Hermes history"));
    n.append(head);
    if (m.role === "tool") {
      if (m.gateway) n.append(gatewayNode(m.gateway));
      const det = el("details"); det.append(el("summary", null, "result (" + (m.content || "").length + " chars)"));
      det.append(el("pre", null, m.content || "")); n.append(det);
    } else {
      if (m.content) n.append(document.createTextNode(m.content));
      else if ((m.calls || []).length) n.append(el("div", "ask", "No text. The model replied by asking for " + (m.calls.length === 1 ? "this tool call:" : m.calls.length + " tool calls:")));
      (m.calls || []).forEach((cl) => n.append(callNode(cl)));
    }
    (card && (reply || m.role === "tool") ? card : convo).append(n);
  });
  const loose = ((t.llm && t.llm.calls) || []).filter((cl) => !cl.reply_message_id);
  if (loose.length) {
    const box = el("div", "box"); box.append(el("h3", null, "Model calls not linked to a message (" + loose.length + ")"));
    loose.forEach((cl) => box.append(callPanel(t.llm, cl))); convo.append(box);
  }
  $("unmatched").textContent = ""; $("events").textContent = "";
  if ((t.unmatched || []).length) $("unmatched").append(entryBox("Gateway calls no message claimed (matching is by time; check these)", t.unmatched, "red"));
  if ((t.events || []).length) $("events").append(entryBox("Approver activity in this window", t.events, ""));

  $("note").value = ann ? ann.note || "" : ""; $("wanted").value = ann ? ann.wanted || "" : "";
  $("mode").value = ann ? ann.mode || "" : ""; $("saved").textContent = ann ? "saved" : "";
  paintVerdict(); dirty = false;
  const stale = $("stale");
  if (ann && ann.message_count && ann.message_count < t.message_count) {
    stale.hidden = false;
    stale.textContent = "This conversation has " + (t.message_count - ann.message_count) + " new message(s) since you annotated it. Check your verdict still holds.";
  } else stale.hidden = true;
  window.scrollTo(0, 0);
}

function setPass(v) { ann = ann || {}; ann.pass = v; paintVerdict(); touch(); }
$("pass").onclick = () => setPass(true);
$("fail").onclick = () => setPass(false);
["note", "wanted", "mode"].forEach((id) => $(id).addEventListener("input", touch));
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("nextun").onclick = () => {
  for (let k = 1; k <= refs.length; k++) {
    const i = (cur + k) % refs.length;
    if (!refs[i].annotated) { show(i); return; }
  }
  say("everything is annotated");
};
$("export").onclick = async () => {
  await flush(); say("pushing…");
  try { const j = await api("POST", "/api/sync"); setUnsynced(j.unsynced); say("pushed " + j.pushed); }
  catch (e) { say("export failed: " + e.message, true); loadIndex(true); }
};
document.addEventListener("keydown", (e) => {
  if (/^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "ArrowRight") show(cur + 1);
  else if (e.key === "n") $("nextun").click();
  else if (e.key === "p") setPass(true);
  else if (e.key === "f") setPass(false);
});
window.addEventListener("beforeunload", () => { if (dirty) flush(); });
loadIndex().catch((e) => say(e.message, true));
</script>
</body>
</html>
