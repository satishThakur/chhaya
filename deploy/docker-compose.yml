# The gateway owns its own lifecycle. It is NOT a child of Hermes: as a child
# process, Hermes would own the lifecycle of the process holding the kill
# switch, and Hermes strips credential-named env vars from MCP subprocesses.
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    # The operator's uid, so the audit log and state.json in the bind mount below are
    # the operator's own files: readable and verifiable from the host, no ACLs.
    user: "${HERMES_UID:?run through scripts/dev.sh (make dev-up)}:${HERMES_GID:?run through scripts/dev.sh (make dev-up)}"
    env_file: .env.gateway        # NEVER .env.hermes — chhayad refuses to start if TELEGRAM_BOT_TOKEN is set in its environment
    environment:
      CHHAYA_DATA_DIR: /data
      CHHAYA_POLICY_FILE: /etc/chhaya/policy.yaml
      CHHAYA_MEMORY_ROOT: /data/memory
      CHHAYA_LISTEN: 0.0.0.0:8443
      CHHAYA_TLS_CERT: /etc/chhaya/certs/gateway.crt
      CHHAYA_TLS_KEY: /etc/chhaya/certs/gateway.key
      CHHAYA_TLS_CA: /etc/chhaya/certs/ca.crt
    volumes:
      # The audit log, kill-switch state and policy marker: a bind mount of a host
      # directory (default ~/.chhaya/gateway, 0700), so it outlives Docker. The host
      # is trusted (docs/decisions.md, 2026-11-07). scripts/dev.sh creates it. It also
      # holds Personal memory (memory/), a local git repo: memory is data, not code,
      # and this repo is public (docs/decisions.md, 2026-11-08).
      - ${CHHAYA_GATEWAY_HOME:?run through scripts/dev.sh (make dev-up)}:/data
      - ../config/policy.yaml:/etc/chhaya/policy.yaml:ro
      - ./certs:/etc/chhaya/certs:ro
    ports:
      - "127.0.0.1:8443:8443"     # localhost only; nothing about this is internet-facing
    restart: unless-stopped

  hermes:
    image: nousresearch/hermes-agent@sha256:1d33f6087fab79d580ffaec34ceed825e11d7bb8e803206be75a56d027c62538
    env_file: .env.hermes         # exactly one secret: Hermes' own bot token
    # Load-bearing. With no CMD the image's main-wrapper.sh runs bare `hermes`, which
    # is the interactive chat CLI: with no TTY it reads EOF, prints "Goodbye", and the
    # container exits and restarts forever. `gateway run` is the foreground messaging
    # gateway — what serves Telegram — and the image's own help names it the Docker mode.
    command: ["gateway", "run"]
    volumes:
      # Hermes' whole state: memories/, skills/, state.db, sessions, .env. A bind mount
      # of a host directory (the layout Hermes' own Docker docs use), not a named
      # volume, so it outlives Docker: `down -v` and `volume prune` cannot reach it and
      # an ordinary host backup covers it. scripts/dev.sh sets the path, creates it 0700,
      # and sets HERMES_UID/HERMES_GID to the operator so files here are the operator's.
      # NOT :ro — Hermes creates cron/ at init and fails on a read-only home.
      - ${CHHAYA_HERMES_HOME:?run through scripts/dev.sh (make dev-up)}:/data
      # Rendered by scripts/dev.sh from hermes/config.yaml with the model values
      # substituted. Mounted read-only, and it must stay that way.
      #
      # The original note here said this becomes read-write if Hermes ever needs to
      # migrate its own config in place. Hermes does — it migrates config version
      # 0 -> 51 at boot and logs `[config-migrate] ERROR: [Errno 30] Read-only file
      # system` — but read-write is the wrong answer, tried and reverted:
      # s6's fix-attrs runs as root and chowns everything under HERMES_HOME to
      # hermes:hermes, which a bind mount propagates to the HOST file. The rendered
      # config came back as 10000:10000 0640, the operator could no longer read it,
      # and `make dev-up` failed to re-render with "Permission denied".
      #
      # The migration failure is a warning, not a fault: `[stage2] Warning:
      # docker_config_migrate.py failed; continuing`, and every setting in this file
      # is still applied — verified by Hermes discovering mcp_servers.chhaya and
      # connecting Telegram on the same boot. Read-only keeps hermes/config.yaml the
      # single source of truth, which is the property that matters: this file carries
      # sampling/elicitation off, the toolsets allowlist and skills.write_approval.
      - ./.hermes-config.rendered.yaml:/data/config.yaml:ro
      # Our persona and routing rules. Read-only for the same reason as config.yaml, and
      # because the agent must not rewrite its own instructions. The image only seeds
      # SOUL.md when the file is absent, so this mount is never overwritten.
      - ../hermes/SOUL.md:/data/SOUL.md:ro
      - ./certs/ca.crt:/certs/ca.crt:ro
      - ./certs/hermes.crt:/certs/hermes.crt:ro
      - ./certs/hermes.key:/certs/hermes.key:ro
      # The image's own certifi bundle with chhaya-ca appended, rebuilt by
      # scripts/dev.sh on every `up`. See build_ca_bundle for why this exists.
      - ./certs/ca-bundle.pem:/certs/ca-bundle.pem:ro
    environment:
      HERMES_HOME: /data
      # The only place the agent's file-write tools may write. The image defaults this
      # to /opt/data, which matches an image whose home is /opt/data; ours is /data, so
      # the default pointed at a directory Hermes does not use and left file writes
      # either denied (in the home) or landing in the container's own filesystem
      # (/opt/data, lost when the container is recreated). Deliberately NOT /data:
      # that would put skills/, .env, memories/ and cron/ in reach of write_file and
      # sidestep skills.write_approval. docs/decisions.md, 2026-11-07.
      HERMES_WRITE_SAFE_ROOT: /data/workspace
      # The image's s6 stage remaps its `hermes` user to these before dropping
      # privileges, so everything Hermes writes into the bind mount above is owned by
      # the operator. Exported by scripts/dev.sh; both must be set.
      HERMES_UID: ${HERMES_UID:?run through scripts/dev.sh (make dev-up)}
      HERMES_GID: ${HERMES_GID:?run through scripts/dev.sh (make dev-up)}
      # How our CA reaches Hermes' TLS verification. Hermes passes `ssl_verify`
      # directly to httpx as `verify=`, and httpx 0.28 rejects a path there when a
      # client certificate is also set, so the MCP server block cannot name a CA —
      # this can. It points at the BUNDLE, never at ca.crt: SSL_CERT_FILE replaces
      # the trust store outright, and with only our CA in it Hermes cannot verify
      # Telegram.
      SSL_CERT_FILE: /certs/ca-bundle.pem
    depends_on:
      - gateway
    restart: unless-stopped

